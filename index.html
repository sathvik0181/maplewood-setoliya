<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maplewood Park Satoliya League</title>
    <script src="https://jsdelivr.net"></script>
    
    <script>
        let players = [
            { name: "Sathvik", style: "Center Catcher", stones: 18, accuracy: 65, evaded: 24 },
            { name: "Saanvi", style: "Striker", stones: 8, accuracy: 84, evaded: 12 },
            { name: "Sri", style: "Beginner", stones: 3, accuracy: 30, evaded: 8 },
            { name: "Raghu", style: "All-Rounder", stones: 22, accuracy: 70, evaded: 35 },
            { name: "Abishiek", style: "All-Rounder", stones: 19, accuracy: 62, evaded: 29 },
            { name: "Deepika", style: "Beginner", stones: 4, accuracy: 25, evaded: 11 },
            { name: "Arhan", style: "Center Catcher", stones: 14, accuracy: 58, evaded: 19 },
            { name: "Shanti", style: "Beginner", stones: 2, accuracy: 35, evaded: 14 },
            { name: "Sudhir", style: "All-Rounder", stones: 25, accuracy: 72, evaded: 41 },
            { name: "Sriram", style: "Striker", stones: 11, accuracy: 89, evaded: 16 },
            { name: "Gyathri", style: "Striker", stones: 9, accuracy: 81, evaded: 15 },
            { name: "Viraj", style: "Side Catcher", stones: 13, accuracy: 50, evaded: 22 },
            { name: "Rajvi", style: "Striker", stones: 12, accuracy: 78, evaded: 18 },
            { name: "Vijay.S", style: "All-Rounder", stones: 20, accuracy: 68, evaded: 30 },
            { name: "Jothi", style: "Striker", stones: 10, accuracy: 83, evaded: 14 },
            { name: "Vaani", style: "Back Catcher", stones: 15, accuracy: 55, evaded: 26 },
            { name: "Srihan", style: "Back Catcher", stones: 16, accuracy: 52, evaded: 28 },
            { name: "Priyanka", style: "Striker", stones: 7, accuracy: 76, evaded: 13 },
            { name: "Vinnay", style: "All-Rounder", stones: 17, accuracy: 60, evaded: 27 },
            { name: "Sunil", style: "All-Rounder", stones: 21, accuracy: 64, evaded: 33 },
            { name: "Julie", style: "Side Catcher", stones: 11, accuracy: 48, evaded: 20 },
            { name: "Krisha", style: "Center Catcher", stones: 15, accuracy: 61, evaded: 21 },
            { name: "Veeksha", style: "Striker", stones: 13, accuracy: 79, evaded: 17 },
            { name: "Divya", style: "Striker", stones: 10, accuracy: 80, evaded: 19 },
            { name: "Vijay.T", style: "All-Rounder", stones: 24, accuracy: 66, evaded: 38 },
            { name: "Anu", style: "Striker", stones: 8, accuracy: 75, evaded: 15 },
            { name: "Murali", style: "All-Rounder", stones: 23, accuracy: 71, evaded: 36 }
        ];

        let currentSortMetric = 'stones';

        function switchTab(target) {
            ['home', 'stats', 'admin'].forEach(tab => {
                const view = document.getElementById(`view-${tab}`);
                if (view) view.style.display = tab === target ? "block" : "none";
                const btn = document.getElementById(`tab-${tab}`);
                if (btn) {
                    btn.style.backgroundColor = tab === target ? "#ea580c" : "#374151";
                    btn.style.color = tab === target ? "white" : "#d1d5db";
                }
            });
        }

        function renderLeaderboard() {
            let sorted = [...players];
            if (currentSortMetric === 'stones') sorted.sort((a, b) => b.stones - a.stones);
            else if (currentSortMetric === 'accuracy') sorted.sort((a, b) => b.accuracy - a.accuracy);
            else if (currentSortMetric === 'evaded') sorted.sort((a, b) => b.evaded - a.evaded);

            const table = document.getElementById('leaderboard-table');
            if (!table) return;
            table.innerHTML = '';
            
            sorted.forEach((player, index) => {
                const rankText = index === 0 ? "Rank 1" : `Rank ${index + 1}`;
                const rankStyle = index === 0 ? "color: #fbbf24; font-weight: 900;" : "color: #9ca3af;";
                
                table.innerHTML += `
                    <tr style="border-bottom: 1px solid #374151;">
                        <td style="padding: 12px; text-align: center; ${rankStyle}">${rankText}</td>
                        <td style="padding: 12px;">
                            <div style="font-weight: bold; color: white;">${player.name}</div>
                            <span style="display: inline-block; font-size: 10px; background-color: #374151; color: #fdba74; padding: 2px 6px; border-radius: 4px; margin-top: 2px;">${player.style}</span>
                        </td>
                        <td style="padding: 12px; text-align: center; font-weight: bold; color: #f97316;">${player.stones}</td>
                        <td style="padding: 12px; text-align: center; font-weight: bold; color: #fbbf24;">${player.accuracy}%</td>
                        <td style="padding: 12px; text-align: center; font-weight: bold; color: #10b981;">${player.evaded}</td>
                    </tr>
                `;
            });
            const badge = document.getElementById('player-count-badge');
            if (badge) badge.innerText = players.length;
        }

        function sortData(metric) {
            currentSortMetric = metric;
            ['stones', 'accuracy', 'evaded'].forEach(item => {
                const btn = document.getElementById(`sort-${item}`);
                if (btn) {
                    btn.style.backgroundColor = item === metric ? "#ea580c" : "#374151";
                    btn.style.color = item === metric ? "white" : "#d1d5db";
                }
            });
            renderLeaderboard();
        }

        function checkAuth() {
            if (document.getElementById('admin-pass').value === 'admin123') {
                document.getElementById('admin-auth').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                renderAdminControls();
            } else {
                alert('Access Denied: Incorrect Admin Password');
            }
        }

        function renderAdminControls() {
            const deleteContainer = document.getElementById('admin-delete-list');
            if (!deleteContainer) return;
            deleteContainer.innerHTML = '';
            players.forEach((p, idx) => {
                deleteContainer.innerHTML += `
                    <button onclick="removePlayer(${idx})" style="background-color: #111827; border: 1px solid #7f1d1d; color: #9ca3af; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; margin: 2px;">
                        ${p.name} x
                    </button>
                `;
            });
        }

        function updateSchedule() {
            const teams = document.getElementById('input-teams').value;
            const schedule = document.getElementById('input-schedule').value;
            if (teams) document.getElementById('display-teams').innerText = teams;
            if (schedule) document.getElementById('display-schedule').innerText = schedule + " | Field: Maplewood Park";
            alert("Match details updated successfully!");
        }

        function addNewPlayer() {
            const name = document.getElementById('new-name').value.trim();
            const style = document.getElementById('new-style').value;
            if (!name) return alert("Please enter player's full name.");
            
            players.push({ name: name, style: style, stones: 0, accuracy: 0, evaded: 0 });
            document.getElementById('new-name').value = '';
            renderLeaderboard();
            renderAdminControls();
            alert(`${name} added to the Satoliya database.`);
        }

        function removePlayer(index) {
            if(confirm(`Are you sure you want to remove ${players[index].name} from the entire league?`)) {
                players.splice(index, 1);
                renderLeaderboard();
                renderAdminControls();
            }
        }

        window.onload = function() {
            renderLeaderboard();
        };
    </script>
</head>
<body style="background-color: #111827; color: #f3f4f6; font-family: sans-serif; margin: 0; padding: 0;">

    <!-- Navigation Bar -->
    <nav style="background-color: #1f2937; border-bottom: 1px solid #374151; padding: 16px; position: sticky; top: 0; z-index: 50;">
        <div style="max-w: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
            <span style="font-size: 20px; font-weight: 900; color: #f97316;">MAPLEWOOD SATOLIYA</span>
            <div style="display: flex; gap: 8px;">
                <button onclick="switchTab('home')" id="tab-home" style="padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: bold; background-color: #ea580c; color: white; border: none; cursor: pointer;">Home & Rules</button>
                <button onclick="switchTab('stats')" id="tab-stats" style="padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: bold; background-color: #374151; color: #d1d5db; border: none; cursor: pointer;">Leaderboards</button>
                <button onclick="switchTab('admin')" id="tab-admin" style="padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: bold; background-color: #374151; color: #d1d5db; border: none; cursor: pointer;">Admin Panel</button>
            </div>
        </div>
    </nav>

    <!-- Header Section -->
    <header style="background: linear-gradient(to bottom, #ea580c, #d97706); padding: 40px 16px; text-align: center;">
        <h1 style="font-size: 40px; font-weight: 800; margin: 0; color: white; text-transform: uppercase;">Maplewood Satoliya Hub</h1>
